# Prism configuration
# Override any value with PRISM_ environment variables.
# Example: PRISM_PORT=8080 overrides port.

# Server
host: "0.0.0.0"
port: 3002

# Data source: "mock" (force mocks), "gateway" (require gateway), "auto" (gateway if key exists, else mock)
data_source: auto

# Logging: debug, info, warn, error
log_level: info

# Obsrvr Gateway
gateway:
  base_url: "https://gateway.withobsrvr.com"
  api_key: ""  # Set via PRISM_GATEWAY_API_KEY env var
  timeout: 30s

# TypeSafe Jev semantic analysis. When enabled, Ledger v3 records a shadow
# preference; deterministic selection still controls rendered summaries.
jev:
  enabled: false
  base_url: "https://api.typesafe.ai"
  api_key: ""  # Set via PRISM_JEV_API_KEY; never commit a credential here
  model: "jev-latest"
  timeout: 2s
  shadow_log_path: ""  # e.g. data/jev-ledger-shadow.jsonl
