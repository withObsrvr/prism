# Prism configuration
# Override any value with PRISM_ environment variables.
# Example: PRISM_PORT=8080 overrides port.

# Server
host: "0.0.0.0"
port: 3002

# Data source: "mock" (force mocks), "gateway" (require gateway), "auto" (gateway if key exists, else mock)
data_source: auto

# Logging: debug, info, warn, error
log_level: info

# Obsrvr Gateway
gateway:
  base_url: "https://gateway.withobsrvr.com"
  api_key: ""  # Set via PRISM_GATEWAY_API_KEY env var
  timeout: 30s
